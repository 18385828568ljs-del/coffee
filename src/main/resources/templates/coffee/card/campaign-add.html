<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org"><head><th:block th:include="include :: header('新建AI卡片活动')"/><th:block th:include="include :: datetimepicker-css"/><link th:href="@{/ruoyi/css/simple-upload.css?v=1.0.0}" rel="stylesheet"/></head>
<body class="white-bg"><div class="wrapper wrapper-content animated fadeInRight ibox-content"><form class="form-horizontal m" id="campaign-form">
<div class="form-group"><label class="col-sm-3 control-label is-required">活动标题：</label><div class="col-sm-8"><input name="title" maxlength="120" class="form-control" required></div></div>
<div class="form-group"><label class="col-sm-3 control-label">活动副标题：</label><div class="col-sm-8"><input name="subtitle" maxlength="255" class="form-control" placeholder="例如：今天的咖啡搭子是谁？"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">小程序入口图：</label><div class="col-sm-8"><input type="hidden" name="coverImage" id="coverImage"><div class="ruoyi-upload-card" id="coverCard"><input id="coverFile" accept="image/*" type="file"><div class="ruoyi-upload-empty"><i class="fa fa-cloud-upload"></i><strong>点击上传入口图</strong><p>不上传时小程序显示默认复古卡背</p></div><div class="ruoyi-upload-preview"><img alt="预览"><div class="ruoyi-upload-actions"><button class="btn btn-primary btn-sm" data-upload-action="change" type="button">重新上传</button><button class="btn btn-default btn-sm" data-upload-action="remove" type="button">移除</button></div></div></div></div></div>
<div class="form-group"><label class="col-sm-3 control-label is-required">开始时间：</label><div class="col-sm-8"><input name="startTime" class="form-control time-input" required></div></div>
<div class="form-group"><label class="col-sm-3 control-label">结束时间：</label><div class="col-sm-8"><input name="endTime" class="form-control time-input"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">排序：</label><div class="col-sm-8"><input name="sortOrder" type="number" value="0" class="form-control"></div></div><input type="hidden" name="status" value="0">
</form></div><th:block th:include="include :: footer"/><th:block th:include="include :: datetimepicker-js"/><script th:src="@{/ruoyi/js/simple-upload.js?v=1.0.0}"></script><script>var prefix=ctx+'coffee/cardCampaign';$('#campaign-form').validate({focusCleanup:true});$('.time-input').datetimepicker({format:'yyyy-mm-dd hh:ii:ss',autoclose:true});RuoYiSimpleUpload.init({card:'#coverCard',fileInput:'#coverFile',targetInput:'#coverImage',previewType:'image'});function submitHandler(){if($.validate.form())$.operate.save(prefix+'/add',$('#campaign-form').serialize());}</script></body></html>
