<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro"><head><th:block th:include="include :: header('AI卡片管理')"/></head><body class="gray-bg"><div class="container-div"><div class="row">
<input id="campaignId" type="hidden" th:value="${campaign.campaignId}"><div class="col-sm-12"><div class="alert alert-info"><strong th:text="${campaign.title}"></strong>：先新增卡片，再生成插画；生成完成后返回活动列表发布。修改文字后点击“重新合成”不会调用AI。</div></div>
<div class="btn-group-sm" id="toolbar"><a class="btn btn-success" onclick="addCard()" shiro:hasPermission="coffee:card:add"><i class="fa fa-plus"></i> 新增卡片</a></div>
<div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div></div></div><th:block th:include="include :: footer"/>
<script th:inline="javascript">var editFlag=[[${@permission.hasPermi('coffee:card:edit')}]],removeFlag=[[${@permission.hasPermi('coffee:card:remove')}]],generateFlag=[[${@permission.hasPermi('coffee:card:generate')}]];var prefix=ctx+'coffee/card',campaignId=$('#campaignId').val();
$(function(){$.table.init({url:prefix+'/list',queryParams:function(p){p.campaignId=campaignId;return p;},modalName:'AI卡片',columns:[{field:'cardId',title:'ID'},{field:'finalImageUrl',title:'成品',formatter:function(v,r){var u=v||r.artworkUrl;return u?'<a href="'+escapeHtml(u)+'" target="_blank"><img src="'+escapeHtml(u)+'" style="width:72px;height:96px;object-fit:cover;border-radius:3px"></a>':'-';}},{field:'title',title:'卡片标题'},{field:'leftProductName',title:'左侧商品'},{field:'rightProductName',title:'右侧商品'},{field:'weight',title:'权重'},{field:'status',title:'状态',formatter:statusText},{field:'lastError',title:'失败原因',formatter:errorText},{title:'操作',align:'center',formatter:function(v,r){var a=[];a.push('<a class="btn btn-success btn-xs '+editFlag+'" onclick="$.modal.open(\'编辑卡片\',\''+prefix+'/edit/'+r.cardId+'\',1100,760)"><i class="fa fa-edit"></i> 编辑</a> ');a.push('<a class="btn btn-primary btn-xs '+generateFlag+'" onclick="generate('+r.cardId+')"><i class="fa fa-magic"></i> '+(r.artworkUrl?'重新生成':'AI生成')+'</a> ');if(r.artworkUrl)a.push('<a class="btn btn-info btn-xs '+editFlag+'" onclick="render('+r.cardId+')"><i class="fa fa-refresh"></i> 重新合成</a> ');a.push('<a class="btn btn-danger btn-xs '+removeFlag+'" onclick="removeCard('+r.cardId+')"><i class="fa fa-remove"></i> 删除</a>');return a.join('');}}]});});
function addCard(){$.modal.open('新增卡片',prefix+'/add/'+campaignId,1100,760);}
function statusText(v){return {0:'<span class="badge badge-default">草稿</span>',1:'<span class="badge badge-info">生成中</span>',2:'<span class="badge badge-success">待发布</span>',3:'<span class="badge badge-primary">已发布</span>',4:'<span class="badge badge-danger">失败</span>',5:'<span class="badge badge-warning">停用</span>'}[v]||'-';}
function errorText(v){if(!v)return '-';var full=escapeHtml(v),shortText=v.length>42?v.substring(0,42)+'...':v;return '<span class="text-danger" title="'+full+'">'+escapeHtml(shortText)+'</span>';}
function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function generate(id){post(prefix+'/generate/'+id,function(){poll(id);});}function render(id){post(prefix+'/render/'+id,function(){$.table.refresh();});}function removeCard(id){$.modal.confirm('确认删除这张卡片？',function(){post(prefix+'/remove',{id:id},function(){$.table.refresh();});});}
function post(url,data,done){if(typeof data==='function'){done=data;data={};}$.ajax({url:url,type:'post',data:data||{},success:function(r){if(r.code===0){$.modal.msgSuccess(r.msg);if(done)done(r);}else $.modal.alertError(r.msg);},error:function(){$.modal.alertError('请求失败');}});}
function poll(id){var timer=setInterval(function(){$.get(prefix+'/task/'+id,function(r){var t=r.data;if(!t)return;if(t.status==='SUCCESS'||t.status==='FAILED'){clearInterval(timer);$.table.refresh();if(t.status==='FAILED')$.modal.alertError(t.errorMessage||'生成失败');}});},2500);}
</script></body></html>
