<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org"><head><th:block th:include="include :: header('新增AI卡片')"/><link th:href="@{/ruoyi/css/simple-upload.css?v=1.0.0}" rel="stylesheet"/><link th:href="@{/ruoyi/css/ai-card-form.css?v=1.0.0}" rel="stylesheet"/></head><body class="white-bg"><div class="wrapper wrapper-content animated fadeInRight ibox-content"><div class="ai-card-layout"><form class="form-horizontal m" id="card-form"><input type="hidden" name="campaignId" th:value="${campaign.campaignId}"><input type="hidden" name="templateCode" value="retro-combo">
<div class="form-group"><label class="col-sm-3 control-label is-required">卡片标题：</label><div class="col-sm-9"><input id="title" name="title" maxlength="80" class="form-control" placeholder="例如：游野组合" required></div></div>
<div class="form-group"><label class="col-sm-3 control-label">英文标题：</label><div class="col-sm-9"><input id="englishTitle" name="englishTitle" maxlength="80" class="form-control" placeholder="例如：COMBO"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">左侧关联商品：</label><div class="col-sm-9"><select id="leftProductSelect" class="form-control"><option value="">手动填写</option><optgroup label="商城商品"><option th:each="p:${mallProducts}" th:value="|mall:${p.productId}|" th:text="${p.productName}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup><optgroup label="点单商品"><option th:each="p:${scanProducts}" th:value="|scan:${p.productId}|" th:text="${p.productName}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup></select><input type="hidden" id="leftProductType" name="leftProductType"><input type="hidden" id="leftProductId" name="leftProductId"><input type="hidden" id="leftProductImage" name="leftProductImage"></div></div>
<div class="form-group"><label class="col-sm-3 control-label is-required">左侧名称：</label><div class="col-sm-9"><input id="leftProductName" name="leftProductName" maxlength="80" class="form-control" required></div></div><div class="form-group"><label class="col-sm-3 control-label">左侧描述：</label><div class="col-sm-9"><input id="leftDescription" name="leftDescription" maxlength="160" class="form-control" placeholder="柑橘 / 榛果 / 热带水果"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">右侧关联商品：</label><div class="col-sm-9"><select id="rightProductSelect" class="form-control"><option value="">手动填写或留空</option><optgroup label="商城商品"><option th:each="p:${mallProducts}" th:value="|mall:${p.productId}|" th:text="${p.productName}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup><optgroup label="点单商品"><option th:each="p:${scanProducts}" th:value="|scan:${p.productId}|" th:text="${p.productName}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup></select><input type="hidden" id="rightProductType" name="rightProductType"><input type="hidden" id="rightProductId" name="rightProductId"><input type="hidden" id="rightProductImage" name="rightProductImage"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">右侧名称：</label><div class="col-sm-9"><input id="rightProductName" name="rightProductName" maxlength="80" class="form-control"></div></div><div class="form-group"><label class="col-sm-3 control-label">右侧描述：</label><div class="col-sm-9"><input id="rightDescription" name="rightDescription" maxlength="160" class="form-control"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">品牌名称：</label><div class="col-sm-9"><input id="brandName" name="brandName" maxlength="80" class="form-control" placeholder="COFFEE STREET"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">品牌Logo：</label><div class="col-sm-9"><input type="hidden" id="logoUrl" name="logoUrl"><div class="ruoyi-upload-card" id="logoCard"><input id="logoFile" accept="image/png,image/jpeg" type="file"><div class="ruoyi-upload-empty"><i class="fa fa-cloud-upload"></i><strong>上传透明PNG Logo</strong></div><div class="ruoyi-upload-preview"><img alt="Logo"><div class="ruoyi-upload-actions"><button class="btn btn-primary btn-sm" data-upload-action="change" type="button">更换</button><button class="btn btn-default btn-sm" data-upload-action="remove" type="button">移除</button></div></div></div></div></div>
<div class="form-group"><label class="col-sm-3 control-label is-required">插画主题：</label><div class="col-sm-9"><textarea id="themePrompt" name="themePrompt" maxlength="1000" rows="3" class="form-control" placeholder="例如：两个拟人咖啡杯在复古咖啡馆里碰杯" required></textarea></div></div>
<div class="form-group"><label class="col-sm-3 control-label">配色：</label><div class="col-sm-5"><select id="paletteCode" name="paletteCode" class="form-control"><option value="candy">波普糖果</option><option value="mint">薄荷黄</option><option value="mocha">摩卡橙</option></select></div><label class="col-sm-2 control-label">权重：</label><div class="col-sm-2"><input name="weight" type="number" min="1" max="10000" value="1" class="form-control"></div></div>
</form><div class="ai-card-preview-wrap"><div id="cardPreview" class="ai-card-preview palette-candy"><div class="ai-card-art"><div class="ai-card-art-empty"></div><div class="ai-card-heading"><span id="previewEnglish">COFFEE CARD</span><span id="previewTitle">今日咖啡</span></div></div><div class="ai-card-info"><div class="ai-card-info-box"><strong id="previewLeftName">咖啡特调</strong><small id="previewLeftDesc">今日风味推荐</small></div><div class="ai-card-info-box"><strong id="previewRightName">咖啡搭子</strong><small id="previewRightDesc">今日风味推荐</small></div></div><div class="ai-card-brand"><span id="previewBrand">COFFEE STREET</span><img id="previewLogo" class="ai-card-logo" style="display:none"></div></div><p class="ai-card-help">这里是动态排版预览。保存后点击“AI生成”制作插画；文字和Logo由Java模板合成，不会交给AI。</p></div></div></div>
<th:block th:include="include :: footer"/><script th:src="@{/ruoyi/js/simple-upload.js?v=1.0.0}"></script><script th:src="@{/ruoyi/js/ai-card-form.js?v=1.0.0}"></script><script>var prefix=ctx+'coffee/card';$('#card-form').validate({focusCleanup:true});RuoYiSimpleUpload.init({card:'#logoCard',fileInput:'#logoFile',targetInput:'#logoUrl',previewType:'image',onChange:function(){AiCardForm.init();}});AiCardForm.init();function submitHandler(){if($.validate.form())$.operate.save(prefix+'/add',$('#card-form').serialize());}</script></body></html>
