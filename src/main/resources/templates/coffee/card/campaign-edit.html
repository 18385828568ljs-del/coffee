<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org"><head><th:block th:include="include :: header('编辑AI卡片活动')"/><th:block th:include="include :: datetimepicker-css"/><link th:href="@{/ruoyi/css/simple-upload.css?v=1.0.0}" rel="stylesheet"/></head>
<body class="white-bg"><div class="wrapper wrapper-content animated fadeInRight ibox-content"><form class="form-horizontal m" id="campaign-form"><input type="hidden" name="campaignId" th:value="${campaign.campaignId}"><input type="hidden" name="status" th:value="${campaign.status}">
<div class="form-group"><label class="col-sm-3 control-label is-required">活动标题：</label><div class="col-sm-8"><input name="title" maxlength="120" class="form-control" th:value="${campaign.title}" required></div></div>
<div class="form-group"><label class="col-sm-3 control-label">活动副标题：</label><div class="col-sm-8"><input name="subtitle" maxlength="255" class="form-control" th:value="${campaign.subtitle}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">小程序入口图：</label><div class="col-sm-8"><input type="hidden" name="coverImage" id="coverImage" th:value="${campaign.coverImage}"><div class="ruoyi-upload-card" id="coverCard"><input id="coverFile" accept="image/*" type="file"><div class="ruoyi-upload-empty"><i class="fa fa-cloud-upload"></i><strong>点击上传入口图</strong></div><div class="ruoyi-upload-preview"><img alt="预览"><div class="ruoyi-upload-actions"><button class="btn btn-primary btn-sm" data-upload-action="change" type="button">重新上传</button><button class="btn btn-default btn-sm" data-upload-action="remove" type="button">移除</button></div></div></div></div></div>
<div class="form-group"><label class="col-sm-3 control-label is-required">开始时间：</label><div class="col-sm-8"><input name="startTime" class="form-control time-input" th:value="${#dates.format(campaign.startTime,'yyyy-MM-dd HH:mm:ss')}" required></div></div>
<div class="form-group"><label class="col-sm-3 control-label">结束时间：</label><div class="col-sm-8"><input name="endTime" class="form-control time-input" th:value="${campaign.endTime == null ? '' : #dates.format(campaign.endTime,'yyyy-MM-dd HH:mm:ss')}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">排序：</label><div class="col-sm-8"><input name="sortOrder" type="number" class="form-control" th:value="${campaign.sortOrder}"></div></div>
</form></div><th:block th:include="include :: footer"/><th:block th:include="include :: datetimepicker-js"/><script th:src="@{/ruoyi/js/simple-upload.js?v=1.0.0}"></script><script>var prefix=ctx+'coffee/cardCampaign';$('#campaign-form').validate({focusCleanup:true});$('.time-input').datetimepicker({format:'yyyy-mm-dd hh:ii:ss',autoclose:true});RuoYiSimpleUpload.init({card:'#coverCard',fileInput:'#coverFile',targetInput:'#coverImage',previewType:'image'});function submitHandler(){if($.validate.form())$.operate.save(prefix+'/edit',$('#campaign-form').serialize());}</script></body></html>
