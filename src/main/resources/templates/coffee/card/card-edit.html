<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org"><head><th:block th:include="include :: header('编辑AI卡片')"/><link th:href="@{/ruoyi/css/simple-upload.css?v=1.0.0}" rel="stylesheet"/><link th:href="@{/ruoyi/css/ai-card-form.css?v=1.0.0}" rel="stylesheet"/></head><body class="white-bg"><div class="wrapper wrapper-content animated fadeInRight ibox-content"><div class="ai-card-layout"><form class="form-horizontal m" id="card-form"><input type="hidden" name="cardId" th:value="${card.cardId}"><input type="hidden" name="campaignId" th:value="${card.campaignId}"><input type="hidden" name="templateCode" th:value="${card.templateCode}">
<div class="form-group"><label class="col-sm-3 control-label is-required">卡片标题：</label><div class="col-sm-9"><input id="title" name="title" maxlength="80" class="form-control" th:value="${card.title}" required></div></div>
<div class="form-group"><label class="col-sm-3 control-label">英文标题：</label><div class="col-sm-9"><input id="englishTitle" name="englishTitle" maxlength="80" class="form-control" th:value="${card.englishTitle}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">左侧关联商品：</label><div class="col-sm-9"><select id="leftProductSelect" class="form-control"><option value="">手动填写</option><optgroup label="商城商品"><option th:each="p:${mallProducts}" th:value="|mall:${p.productId}|" th:text="${p.productName}" th:selected="${card.leftProductType == 'mall' and card.leftProductId == p.productId}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup><optgroup label="点单商品"><option th:each="p:${scanProducts}" th:value="|scan:${p.productId}|" th:text="${p.productName}" th:selected="${card.leftProductType == 'scan' and card.leftProductId == p.productId}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup></select><input type="hidden" id="leftProductType" name="leftProductType" th:value="${card.leftProductType}"><input type="hidden" id="leftProductId" name="leftProductId" th:value="${card.leftProductId}"><input type="hidden" id="leftProductImage" name="leftProductImage" th:value="${card.leftProductImage}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label is-required">左侧名称：</label><div class="col-sm-9"><input id="leftProductName" name="leftProductName" maxlength="80" class="form-control" th:value="${card.leftProductName}" required></div></div><div class="form-group"><label class="col-sm-3 control-label">左侧描述：</label><div class="col-sm-9"><input id="leftDescription" name="leftDescription" maxlength="160" class="form-control" th:value="${card.leftDescription}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">右侧关联商品：</label><div class="col-sm-9"><select id="rightProductSelect" class="form-control"><option value="">手动填写或留空</option><optgroup label="商城商品"><option th:each="p:${mallProducts}" th:value="|mall:${p.productId}|" th:text="${p.productName}" th:selected="${card.rightProductType == 'mall' and card.rightProductId == p.productId}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup><optgroup label="点单商品"><option th:each="p:${scanProducts}" th:value="|scan:${p.productId}|" th:text="${p.productName}" th:selected="${card.rightProductType == 'scan' and card.rightProductId == p.productId}" th:attr="data-name=${p.productName},data-image=${p.imageUrl}"></option></optgroup></select><input type="hidden" id="rightProductType" name="rightProductType" th:value="${card.rightProductType}"><input type="hidden" id="rightProductId" name="rightProductId" th:value="${card.rightProductId}"><input type="hidden" id="rightProductImage" name="rightProductImage" th:value="${card.rightProductImage}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">右侧名称：</label><div class="col-sm-9"><input id="rightProductName" name="rightProductName" maxlength="80" class="form-control" th:value="${card.rightProductName}"></div></div><div class="form-group"><label class="col-sm-3 control-label">右侧描述：</label><div class="col-sm-9"><input id="rightDescription" name="rightDescription" maxlength="160" class="form-control" th:value="${card.rightDescription}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">品牌名称：</label><div class="col-sm-9"><input id="brandName" name="brandName" maxlength="80" class="form-control" th:value="${card.brandName}"></div></div>
<div class="form-group"><label class="col-sm-3 control-label">品牌Logo：</label><div class="col-sm-9"><input type="hidden" id="logoUrl" name="logoUrl" th:value="${card.logoUrl}"><div class="ruoyi-upload-card" id="logoCard"><input id="logoFile" accept="image/png,image/jpeg" type="file"><div class="ruoyi-upload-empty"><i class="fa fa-cloud-upload"></i><strong>上传透明PNG Logo</strong></div><div class="ruoyi-upload-preview"><img alt="Logo"><div class="ruoyi-upload-actions"><button class="btn btn-primary btn-sm" data-upload-action="change" type="button">更换</button><button class="btn btn-default btn-sm" data-upload-action="remove" type="button">移除</button></div></div></div></div></div>
<div class="form-group"><label class="col-sm-3 control-label is-required">插画主题：</label><div class="col-sm-9"><textarea id="themePrompt" name="themePrompt" maxlength="1000" rows="3" class="form-control" required th:text="${card.themePrompt}"></textarea></div></div>
<div class="form-group"><label class="col-sm-3 control-label">配色：</label><div class="col-sm-5"><select id="paletteCode" name="paletteCode" class="form-control"><option value="candy" th:selected="${card.paletteCode == 'candy'}">波普糖果</option><option value="mint" th:selected="${card.paletteCode == 'mint'}">薄荷黄</option><option value="mocha" th:selected="${card.paletteCode == 'mocha'}">摩卡橙</option></select></div><label class="col-sm-2 control-label">权重：</label><div class="col-sm-2"><input name="weight" type="number" min="1" max="10000" class="form-control" th:value="${card.weight}"></div></div>
</form><div class="ai-card-preview-wrap"><div id="cardPreview" th:class="|ai-card-preview palette-${card.paletteCode}|"><div class="ai-card-art"><img th:if="${card.artworkUrl != null and card.artworkUrl != ''}" th:src="${card.artworkUrl}" alt="AI插画"><div th:unless="${card.artworkUrl != null and card.artworkUrl != ''}" class="ai-card-art-empty"></div><div class="ai-card-heading"><span id="previewEnglish" th:text="${card.englishTitle}">COFFEE CARD</span><span id="previewTitle" th:text="${card.title}">今日咖啡</span></div></div><div class="ai-card-info"><div class="ai-card-info-box"><strong id="previewLeftName" th:text="${card.leftProductName}"></strong><small id="previewLeftDesc" th:text="${card.leftDescription}"></small></div><div class="ai-card-info-box"><strong id="previewRightName" th:text="${card.rightProductName}"></strong><small id="previewRightDesc" th:text="${card.rightDescription}"></small></div></div><div class="ai-card-brand"><span id="previewBrand" th:text="${card.brandName}"></span><img id="previewLogo" class="ai-card-logo" th:src="${card.logoUrl}" th:style="${card.logoUrl == null or card.logoUrl == '' ? 'display:none' : ''}"></div></div><p class="ai-card-help">保存文字后回到列表点击“重新合成”，不调用AI。只有“重新生成”会产生新的AI费用。</p></div></div></div>
<th:block th:include="include :: footer"/><script th:src="@{/ruoyi/js/simple-upload.js?v=1.0.0}"></script><script th:src="@{/ruoyi/js/ai-card-form.js?v=1.0.0}"></script><script>var prefix=ctx+'coffee/card';$('#card-form').validate({focusCleanup:true});RuoYiSimpleUpload.init({card:'#logoCard',fileInput:'#logoFile',targetInput:'#logoUrl',previewType:'image'});AiCardForm.init();function submitHandler(){if($.validate.form())$.operate.save(prefix+'/edit',$('#card-form').serialize());}</script></body></html>
