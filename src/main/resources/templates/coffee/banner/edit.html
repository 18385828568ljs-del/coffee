<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改轮播图')" />
    <link th:href="@{/ruoyi/css/simple-upload.css?v=1.0.0}" rel="stylesheet"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-banner-edit" th:object="${abucoderBanners}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">轮播图标题：</label>
                <div class="col-sm-8">
                    <input name="bannerTitle" th:field="*{bannerTitle}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">轮播图片：</label>
                <div class="col-sm-8">
                    <input type="hidden" name="bannerImg" id="bannerImg" th:field="*{bannerImg}">
                    <div class="ruoyi-upload-card" id="bannerImgCard">
                        <input id="bannerImgFile" accept="image/*" name="file" type="file">
                        <div class="ruoyi-upload-empty">
                            <i class="fa fa-cloud-upload"></i>
                            <strong>拖拽图片到这里，或点击上传</strong>
                            <p>支持 JPG、PNG、GIF，上传后会立即预览</p>
                        </div>
                        <div class="ruoyi-upload-preview">
                            <img alt="轮播图片预览" src="">
                            <div class="ruoyi-upload-actions">
                                <button class="btn btn-primary btn-sm" data-upload-action="change" type="button">重新上传</button>
                                <button class="btn btn-default btn-sm" data-upload-action="remove" type="button">移除图片</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">跳转链接：</label>
                <div class="col-sm-8">
                    <input name="bannerUrl" th:field="*{bannerUrl}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" th:field="*{remark}"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:src="@{/ruoyi/js/simple-upload.js?v=1.0.0}"></script>
    <script th:inline="javascript">
        var prefix = ctx + "coffee/banner";
        $("#form-banner-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-banner-edit').serialize());
            }
        }

        var bannerImg = [[${abucoderBanners.bannerImg}]];
        RuoYiSimpleUpload.init({
            card: "#bannerImgCard",
            fileInput: "#bannerImgFile",
            targetInput: "#bannerImg",
            previewType: "image",
            initialUrl: bannerImg
        });
    </script>
</body>
</html>
