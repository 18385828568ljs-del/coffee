<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('支付日志列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>业务类型：</label>
                                <select name="businessType">
                                    <option value="">全部</option>
                                    <option value="SCAN_ORDER">点单订单</option>
                                    <option value="MALL_ORDER">商城订单</option>
                                </select>
                            </li>
                            <li>
                                <label>业务单号：</label>
                                <input type="text" name="businessNo"/>
                            </li>
                            <li>
                                <label>用户ID：</label>
                                <input type="text" name="userId"/>
                            </li>
                            <li>
                                <label>支付方式：</label>
                                <select name="payType">
                                    <option value="">全部</option>
                                    <option value="balance">余额支付</option>
                                </select>
                            </li>
                            <li>
                                <label>状态：</label>
                                <select name="status">
                                    <option value="">全部</option>
                                    <option value="PAID">已支付</option>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "coffee/paymentLog";

        $(function() {
            var options = {
                url: prefix + "/list",
                modalName: "支付日志",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'logId',
                    title: '日志ID',
                    visible: false
                },
                {
                    field: 'businessType',
                    title: '业务类型',
                    width: 100,
                    formatter: function(v) {
                        var map = {
                            SCAN_ORDER: '点单订单',
                            MALL_ORDER: '商城订单'
                        };
                        return map[v] || $.common.nullToStr(v);
                    }
                },
                {
                    field: 'businessNo',
                    title: '业务单号',
                    width: 190
                },
                {
                    field: 'userId',
                    title: '用户ID',
                    width: 90
                },
                {
                    field: 'payType',
                    title: '支付方式',
                    width: 100,
                    formatter: function(v) {
                        var map = {balance: '余额支付'};
                        return map[v] || $.common.nullToStr(v);
                    }
                },
                {
                    field: 'amount',
                    title: '金额',
                    width: 100,
                    align: 'right',
                    formatter: function(v) {
                        if (v === null || v === undefined || v === '') return '-';
                        return '¥' + parseFloat(v).toFixed(2);
                    }
                },
                {
                    field: 'status',
                    title: '状态',
                    width: 100,
                    align: 'center',
                    formatter: function(v) {
                        var map = {
                            PAID: '<span class="badge badge-success">已支付</span>'
                        };
                        return map[v] || $.common.nullToStr(v);
                    }
                },
                {
                    field: 'createTime',
                    title: '创建时间',
                    width: 160
                },
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
